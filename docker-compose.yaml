version: "3.5"
name: better-auth-demo
services:
  postgres:
    container_name: better-auth-demo-postgres
    image: postgres:15.2
    command: -c 'max_connections=500' -c 'fsync=off' -c 'synchronous_commit=off' -c 'wal_level=minimal' -c 'max_wal_senders=0'
    networks:
      - better-auth-demo-network
    environment:
      - POSTGRES_USER=better-auth-demo
      - POSTGRES_PASSWORD=better-auth-demo
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
networks:
  better-auth-demo-network:
    driver: bridge
    name: better-auth-demo-network

volumes:
  postgres_data: {}
